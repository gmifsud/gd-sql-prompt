name: Spike S1 (SSMS extension)

on:
  push:
    paths:
      - 'spikes/S1.SsmsHost/**'
      - '.github/workflows/spike-s1-vsix.yml'
      - 'Directory.Packages.props'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vsix:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: microsoft/setup-msbuild@v2
      - name: Build VSIX (full MSBuild; VSIX packaging needs Windows)
        run: msbuild spikes/S1.SsmsHost/S1.SsmsHost.csproj /restore /p:Configuration=Release /v:minimal /nologo
      - name: Verify VSIX contents (registrations SSMS needs to load the package)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $vsix = Get-ChildItem spikes/S1.SsmsHost/bin/Release -Recurse -Filter *.vsix | Select-Object -First 1
          if (-not $vsix) { throw 'No .vsix produced' }
          $zip = [IO.Compression.ZipFile]::OpenRead($vsix.FullName)
          function Read-Entry($entry) { $r = New-Object IO.StreamReader($entry.Open()); try { $r.ReadToEnd() } finally { $r.Dispose() } }
          try {
            $zip.Entries | ForEach-Object { '{0,9}  {1}' -f $_.Length, $_.FullName }
            $pkgdef = $zip.Entries | Where-Object Name -like '*.pkgdef' | Select-Object -First 1
            if (-not $pkgdef) { throw 'No .pkgdef in VSIX: package registration missing' }
            $text = Read-Entry $pkgdef
            "---- $($pkgdef.Name)"; $text
            if ($text -notmatch '\\Menus\]') { throw 'pkgdef: menu resource not registered' }
            if ($text -notmatch 'AutoLoadPackages') { throw 'pkgdef: auto-load not registered' }
            $manifest = Read-Entry ($zip.Entries | Where-Object Name -eq 'extension.vsixmanifest')
            if ($manifest -notmatch 'Microsoft.VisualStudio.MefComponent') { throw 'manifest: MEF component asset missing' }
            if ($manifest -notmatch 'Microsoft.VisualStudio.Ssms') { throw 'manifest: SSMS installation target missing' }
            'VSIX verified: pkgdef (menus, auto-load), MEF component, SSMS target.'
          } finally { $zip.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: S1.SsmsHost-vsix
          path: spikes/S1.SsmsHost/bin/Release/**/*.vsix
          if-no-files-found: error
