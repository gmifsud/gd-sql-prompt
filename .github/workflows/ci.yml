name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
      - name: Analyse corpus (clean fixtures must report no errors)
        run: dotnet run -c Release --no-build --project src/SqlCompanion.Cli -- analyze tests/Corpus/acceptance/A-schema-aware-completion.sql tests/Corpus/lexical/procedure.sql tests/Corpus/lexical/literals.sql
